<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Foodie</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A221D" media="(prefers-color-scheme: dark)">
<meta name="description" content="Ricette sane, piano pasti settimanale, diario e allenamento.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Foodie">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
img{max-width:100%}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: app a schede (Piano, Ricette, Consigli, Profilo), colonna centrale 960px, giorni del piano in griglia che diventa una colonna su telefono */
:root{
  --bg:#F4F6F1; --surface:#FFFFFF; --sunk:#E9EDE5; --line:#D5DCCF;
  --ink:#1C2620; --muted:#5B675F;
  --basil:#2E6A4C; --basil-ink:#FFFFFF; --basil-soft:#DCEBE1;
  --saffron:#C98A12; --saffron-soft:#F7E7C2;
  --tomato:#B8442F;
  --c-col:#C98A12; --c-pra:#2E6A4C; --c-cen:#3D5A99; --c-spu:#8A5A9E;
  --basil-text:#1F5139; --col-soft:#F8EBCB; --pra-soft:#DCEBE1; --cen-soft:#E3E9F6; --spu-soft:#F0E6F4; --accent:#F7A93B; --shadow:0 1px 2px rgb(28 38 32 / .06), 0 4px 14px rgb(28 38 32 / .06);
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121814; --surface:#1A221D; --sunk:#222C25; --line:#334037;
  --ink:#E7EDE8; --muted:#9AA79F;
  --basil:#6FBF93; --basil-ink:#0E1A13; --basil-soft:#1F3829;
  --saffron:#E8B04A; --saffron-soft:#3A2E14; --tomato:#E77A63;
  --c-col:#E8B04A; --c-pra:#6FBF93; --c-cen:#8FA8E8; --c-spu:#C79BDB;
  --basil-text:#C5EBD5; --col-soft:#3A2E14; --pra-soft:#27523C; --cen-soft:#1F2840; --spu-soft:#2C2236; --accent:#F2B04F; --shadow:0 1px 2px rgb(0 0 0 / .3), 0 4px 14px rgb(0 0 0 / .25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121814; --surface:#1A221D; --sunk:#222C25; --line:#334037;
  --ink:#E7EDE8; --muted:#9AA79F;
  --basil:#6FBF93; --basil-ink:#0E1A13; --basil-soft:#1F3829;
  --saffron:#E8B04A; --saffron-soft:#3A2E14; --tomato:#E77A63;
  --c-col:#E8B04A; --c-pra:#6FBF93; --c-cen:#8FA8E8; --c-spu:#C79BDB;
  --basil-text:#C5EBD5; --col-soft:#3A2E14; --pra-soft:#27523C; --cen-soft:#1F2840; --spu-soft:#2C2236; --accent:#F2B04F; --shadow:0 1px 2px rgb(0 0 0 / .3), 0 4px 14px rgb(0 0 0 / .25);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--basil);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:16px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand svg{flex:none}
.brand h1{font-size:1.3rem;letter-spacing:-.01em}
nav.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;overflow-x:auto;max-width:100%}
nav.tabs a{padding:6px 14px;border-radius:999px;text-decoration:none;color:var(--muted);font-weight:500;white-space:nowrap}
nav.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}

main{padding-block:20px 48px}
section.view{display:grid;gap:20px}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid transparent;background:var(--pra-soft);color:var(--basil-text);padding:9px 16px;border-radius:999px;font-weight:600;line-height:1.2;text-decoration:none}
.btn:hover{border-color:var(--basil)}
.btn.primary{background:var(--basil);color:var(--basil-ink);border-color:var(--basil)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.small{padding:7px 13px;font-size:.85rem}
.btn.big{padding:13px 22px;font-size:1rem}
.btn svg{flex:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* Riepilogo obiettivo */
.goal{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.goal .kcal{font-family:var(--display);font-size:2.4rem;font-weight:700;line-height:1}
.goal .kcal small{font-family:var(--body);font-size:.9rem;font-weight:500;color:var(--muted);margin-left:4px}
.macros{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.macro .lbl{font-size:.8rem;color:var(--muted)}
.macro .val{font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%}
.note{font-size:.85rem;color:var(--muted);background:var(--sunk);border-radius:8px;padding:8px 12px}
.note b{color:var(--ink)}

/* Piano */
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.day{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:8px;align-content:start}
.day-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.day-h h3{font-size:1.1rem}
.day-h .tot{font-size:.85rem;color:var(--muted)}
.meal{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.meal .dot{align-self:stretch;border-radius:2px}
.meal .info{min-width:0}
.meal .slot{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.meal .name{background:none;border:0;padding:0;text-align:left;font-weight:500;line-height:1.3}
.meal .name:hover{color:var(--basil);text-decoration:underline}
.meal .meta{font-size:.8rem;color:var(--muted)}
.swap{border:1.5px solid transparent;background:var(--pra-soft);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;color:var(--basil-text)}
.swap:hover{color:var(--basil);border-color:var(--basil)}
.c-colazione{background:var(--c-col)} .c-pranzo{background:var(--c-pra)} .c-cena{background:var(--c-cen)} .c-spuntino{background:var(--c-spu)}

/* Lista spesa */
.shop{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.shop ul{list-style:none;margin:12px 0 0;padding:0;columns:2 240px;column-gap:24px}
.shop li{break-inside:avoid;padding:4px 0;display:flex;gap:8px;align-items:baseline}
.shop label{display:flex;gap:8px;align-items:baseline;cursor:pointer;width:100%}
.shop .q{margin-left:auto;color:var(--muted);white-space:nowrap}
.shop input:checked + span{text-decoration:line-through;color:var(--muted)}

/* Ricette */
.filters{display:grid;gap:10px}
.search{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:.85rem;font-weight:500}
.chip:hover{border-color:var(--basil)}
.chip[aria-pressed="true"]{background:var(--basil);color:var(--basil-ink);border-color:var(--basil)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:grid;gap:6px;align-content:start}
.card:hover{border-color:var(--basil)}
.card h3{font-size:1.02rem;font-family:var(--body);font-weight:600}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:.72rem;padding:1px 8px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.tag.slot{color:var(--ink)}
.kv{display:flex;gap:12px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}
.kv b{color:var(--ink);font-weight:600}

/* Consigli */
.myth{background:var(--saffron-soft);border-radius:var(--r);padding:18px;display:grid;gap:8px}
.myth h2{font-size:1.25rem}
.tips{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.tip{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:6px;align-content:start}
.tip h3{font-size:1.05rem}
.tip p{margin:0}
.tip .src{font-size:.78rem;color:var(--muted)}

/* Profilo */
.form{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.field{display:grid;gap:4px}
.field label{font-size:.85rem;font-weight:500}
.field input,.field select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .v{font-family:var(--display);font-size:1.6rem;font-weight:700}
.stat .l{font-size:.82rem;color:var(--muted)}
.example{display:inline-block;background:var(--saffron-soft);color:var(--ink);font-size:.78rem;padding:2px 10px;border-radius:999px;font-weight:500}

/* Scheda ricetta */
.overlay{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:20;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.sheet{background:var(--surface);border-radius:16px;max-width:620px;width:100%;max-height:100%;overflow:auto;padding:22px;display:grid;gap:14px}
.sheet-h{display:flex;gap:12px;align-items:start}
.sheet-h h2{font-size:1.45rem;margin-right:auto}
.icon-btn{border:1.5px solid transparent;background:var(--sunk);border-radius:999px;width:38px;height:38px;display:grid;place-items:center;flex:none;color:var(--ink)}
.icon-btn:hover{border-color:var(--basil)}
.icon-btn[aria-pressed="true"]{color:var(--tomato);border-color:var(--tomato)}
.nut{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;background:var(--sunk);border-radius:10px;padding:10px}
.nut div{text-align:center}
.nut b{display:block;font-size:1.1rem}
.nut span{font-size:.75rem;color:var(--muted)}
.portion{display:flex;align-items:center;gap:8px}
.ing{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.ing li{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.steps{margin:0;padding-left:20px;display:grid;gap:6px}
.hint{background:var(--basil-soft);border-radius:10px;padding:10px 12px;font-size:.9rem}
.empty{padding:24px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}

/* Diario: navigazione giorni e settimana */
.dnav{display:flex;align-items:center;gap:10px}
.dnav-t{flex:1;min-width:0;text-align:center}
.dnav .icon-btn{font-size:1.4rem;line-height:1}
.icon-btn:disabled{opacity:.35;cursor:default}
.wchart{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wcol{border:0;background:none;padding:4px 0;display:grid;gap:4px;justify-items:center;border-radius:8px}
.wcol.sel{background:var(--sunk)}
.wbar{position:relative;width:60%;max-width:28px;height:90px;background:var(--sunk);border-radius:6px;overflow:hidden;display:flex;align-items:flex-end}
.wcol.sel .wbar{background:var(--bg)}
.wbar i{display:block;width:100%;border-radius:6px 6px 0 0}
.wbar em{position:absolute;left:-2px;right:-2px;height:0;border-top:2px dashed var(--ink);opacity:.45}
.wl{font-size:.75rem;color:var(--muted);text-align:center;line-height:1.2;text-transform:uppercase}
.panel .results{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.panel .stat{padding:10px;background:var(--sunk);border:0}
.panel .stat .v{font-size:1.3rem}
.panel .stat .l{font-size:.75rem;line-height:1.3}
@media (max-width:560px){ .panel .macros{grid-template-columns:1fr;gap:10px} }

/* Oggi, dispensa, modalità cucina */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px;align-content:start}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.trk{display:grid;gap:4px;min-width:0}
.trk-h{display:flex;justify-content:space-between;gap:8px;font-size:.88rem}
.bar.big{height:10px;border-radius:5px}
.items{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.items li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;border-top:1px solid var(--line);padding-top:6px;font-size:.9rem}
.icon-btn.sm{width:28px;height:28px}
.inline{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
.inline .field{flex:1 1 90px;min-width:0}
.inline .field.wide{flex:3 1 200px}
.field textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);width:100%;font:inherit;resize:vertical}
fieldset.field{border:0;padding:0;margin:0}
fieldset.field legend{font-size:.85rem;font-weight:500;margin-bottom:4px}
.chk{display:inline-flex;gap:6px;align-items:center;font-size:.88rem;border:1px solid var(--line);border-radius:999px;padding:4px 10px;cursor:pointer}
.mf{display:grid;gap:12px}
.water{display:flex;gap:6px;flex-wrap:wrap}
.glass{width:30px;height:38px;border:1.5px solid var(--line);border-radius:4px 4px 9px 9px;background:var(--surface);padding:0;display:flex;align-items:flex-end;overflow:hidden}
.glass i{display:block;width:100%;height:0;background:var(--c-cen);opacity:.7;transition:height .15s}
.glass.full i{height:75%}
.spark{width:100%;height:auto;display:block}
.pantry{display:grid;gap:6px;background:var(--basil-soft);border-radius:var(--r);padding:12px}
.pantry label{font-size:.9rem}
.have{font-size:.8rem;color:var(--basil);font-weight:600}
.pantry-in{border-radius:14px;resize:vertical;font:inherit;line-height:1.4}
.pres{display:grid;gap:8px;margin-bottom:6px}
.tag.ok{background:var(--basil);color:var(--basil-ink)}
.psec{display:grid;gap:8px;margin-top:14px}
.psec h3{font-size:1.1rem}
.psec p{margin:0;font-size:.88rem}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:6px 10px}
table.pt{width:100%;border-collapse:collapse;font-size:.9rem;min-width:520px}
.pt th,.pt td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
.pt tr:last-child td{border-bottom:0}
.pt th{font-size:.75rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
.pt .n{text-align:right}
.pe{display:grid;grid-template-columns:1fr 52px;gap:8px;align-items:center}
.pe .bar{margin:0}
.cook{position:fixed;inset:0;z-index:30;background:var(--bg);display:grid;grid-template-rows:auto auto 1fr auto;gap:14px;
  padding:calc(env(safe-area-inset-top,0px) + 14px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 14px) max(16px,env(safe-area-inset-left,0px))}
.ck-top{display:flex;align-items:center;gap:12px;max-width:760px;width:100%;margin:0 auto}
.ck-title{margin-right:auto;font-family:var(--display);font-size:1.05rem;min-width:0}
.ck-timer{background:var(--saffron-soft);border-radius:999px;padding:4px 12px;font-weight:700;font-size:1.1rem}
.ck-timer.done{background:var(--tomato);color:#fff}
.ck-dots{display:flex;gap:4px;max-width:760px;width:100%;margin:0 auto}
.ck-dots i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.ck-dots i.on{background:var(--basil)}
.ck-body{overflow:auto;max-width:760px;width:100%;margin:0 auto;display:grid;gap:16px;align-content:start}
.ck-step{font-family:var(--display);font-size:clamp(1.35rem,4.6vw,2.1rem);line-height:1.35;margin:0;text-wrap:pretty}
.ck-ing{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.ck-ing label{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 4px;border-bottom:1px solid var(--line);font-size:1.05rem;cursor:pointer}
.ck-ing input{width:20px;height:20px}
.ck-ing input:checked + span{text-decoration:line-through;color:var(--muted)}
.ck-nav{display:flex;justify-content:space-between;gap:12px;max-width:760px;width:100%;margin:0 auto}
.ck-nav .btn{padding:12px 22px;font-size:1rem}
.btn:disabled{opacity:.4;cursor:default}

/* Superfood e obiettivi */
.pill{font-size:.8rem;font-weight:600;padding:3px 12px;border-radius:999px;background:var(--basil-soft);color:var(--ink)}
.pill.sf{background:var(--saffron-soft)}
.boost{font-size:.84rem;background:var(--saffron-soft);border-radius:8px;padding:6px 10px}
.cov{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.cov summary{cursor:pointer}
.cov-g{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px 24px;margin-top:12px}
.cov-r{display:grid;grid-template-columns:110px 1fr 44px;gap:10px;align-items:center;font-size:.88rem}
.cov-r .bar{margin-top:0}
.cov-v{text-align:right;color:var(--muted)}
.mic{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mic li{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:.88rem}
.tag.sfm{background:var(--saffron-soft);color:var(--ink);white-space:nowrap}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400 !important;cursor:pointer}
.check input{margin-top:4px;width:auto}
@media (max-width:560px){.mic li{grid-template-columns:1fr}}

/* Allenamento */
.seg{display:inline-flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
.seg button{border:0;background:none;padding:6px 16px;border-radius:999px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:.8rem}
.wd b{display:block;font-family:var(--display);font-size:1.05rem}
.wd.on{background:var(--basil);border-color:var(--basil);color:var(--basil-ink)}
.wd.walk{background:var(--basil-soft)}
.workouts{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}

const ACT = {sed:[1.2,'Sedentario'],leggero:[1.375,'Leggero (1–3 allenamenti/sett.)'],moderato:[1.55,'Moderato (3–5/sett.)'],intenso:[1.725,'Intenso (6–7/sett.)']};
const PROT = {giu:1.6,ricomp:2.0,mant:1.4,su:1.8};
const OBJ = {ricomp:'Ricomposizione (skinny fat)',giu:'Dimagrire',mant:'Mantenere il peso',su:'Aumentare massa'};

function calc(p){
  const bmr = 10*p.peso + 6.25*p.alt - 5*p.eta + (p.sesso==='m'?5:-161);
  const tdee = bmr*ACT[p.att][0];
  let target = p.obj==='giu' ? tdee-Math.min(tdee*.2,500) : p.obj==='ricomp' ? tdee-Math.min(tdee*.1,300) : p.obj==='su' ? tdee+250 : tdee;
  const floor = p.sesso==='m'?1500:1200;
  const floored = target<floor; target=Math.max(target,floor);
  target = Math.round(target/10)*10;
  const prot = Math.round(p.peso*PROT[p.obj]);
  const fat = Math.round(target*.3/9);
  const carb = Math.max(0,Math.round((target-prot*4-fat*9)/4));
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),target,prot,fat,carb,floored};
}
function dietOK(r,d){ if(d==='nopork')return !r.tags.includes('maiale'); if(d==='vegan')return r.tags.includes('vegan'); if(d==='veg')return r.tags.includes('veg')||r.tags.includes('vegan'); return true; }
function pool(slot){ return R.filter(r=>r.m.includes(slot)&&dietOK(r,profile.dieta)); }
function portion(r,kcal){ const x=Math.round((kcal/r.k)*4)/4; return Math.min(2,Math.max(.5,x)); }
const pick = a => a[Math.floor(Math.random()*a.length)];

function pickW(a){ const w=a.map(r=>(r.mi.length+1)**2); let x=Math.random()*w.reduce((s,v)=>s+v,0); for(let i=0;i<a.length;i++){x-=w[i];if(x<=0)return a[i]} return a[a.length-1]; }
const choose = a => profile.sf ? pickW(a) : pick(a);
function coverage(days){ const c={}; Object.keys(NUTR).forEach(k=>c[k]=0); days.forEach(d=>SLOTS.forEach(([sl])=>byId[d[sl].id].mi.forEach(m=>c[m]++))); return c; }

function makePlan(){
  const T = calc(profile).target, used={}, days=[];
  for(let d=0; d<7; d++){
    const day={};
    for(const [slot,share] of SLOTS){
      const prev = d>0 ? days[d-1][slot].id : null;
      const today = Object.values(day).map(e=>e.id);
      let c = pool(slot).filter(r=>(used[r.id]||0)<2 && r.id!==prev && !today.includes(r.id));
      if(!c.length) c = pool(slot);
      const r = choose(c); used[r.id]=(used[r.id]||0)+1;
      day[slot]={id:r.id,x:portion(r,T*share)};
    }
    days.push(day);
  }
  // Rispetta i consigli: almeno 2 pasti di pesce e 3 di legumi a settimana (pranzo/cena)
  const ensure=(tag,n)=>{
    const cands = R.filter(r=>r.tags.includes(tag));
    if(!cands.some(r=>dietOK(r,profile.dieta))) return;
    for(let i=0;i<30;i++){
      const count = days.reduce((s,d)=>s+['pranzo','cena'].filter(sl=>byId[d[sl].id].tags.includes(tag)).length,0);
      if(count>=n) return;
      const d = Math.floor(Math.random()*7), sl = pick(['pranzo','cena']);
      const cur = byId[days[d][sl].id];
      if(cur.tags.includes(tag) || (tag==='legumi'&&cur.tags.includes('pesce')) || (tag==='pesce'&&cur.tags.includes('legumi'))) continue;
      const opts = pool(sl).filter(r=>r.tags.includes(tag)&&(used[r.id]||0)<2);
      if(!opts.length) return;
      const r = pick(opts); used[cur.id]--; used[r.id]=(used[r.id]||0)+1;
      days[d][sl]={id:r.id,x:portion(r,T*SLOTS.find(s=>s[0]===sl)[1])};
    }
  };
  // Superfood: copri i micronutrienti più spesso carenti
  if(profile.sf){
    const allSlots = SLOTS.map(s=>s[0]);
    for(const m of ['omega3','vitD','ferro','calcio','probiotici','iodio','zinco','vitC','folati']){
      for(let i=0;i<30;i++){
        if(coverage(days)[m]>=NUTR[m].w) break;
        const d=Math.floor(Math.random()*7), sl=pick(allSlots), cur=byId[days[d][sl].id];
        if(cur.mi.includes(m)) continue;
        const opts = pool(sl).filter(r=>r.mi.includes(m)&&(used[r.id]||0)<2);
        if(!opts.length) continue;
        const r=pickW(opts); used[cur.id]--; used[r.id]=(used[r.id]||0)+1;
        days[d][sl]={id:r.id,x:portion(r,T*SLOTS.find(s=>s[0]===sl)[1])};
      }
    }
  }
  ensure('pesce',2); ensure('legumi',3);
  plan={days,target:T,created:Date.now()};
  shopDone=new Set(); store.set('shop',[]);
  store.set('plan',plan);
}
function swap(d,slot){
  const cur = plan.days[d][slot].id;
  const c = pool(slot).filter(r=>r.id!==cur);
  const r = choose(c);
  plan.days[d][slot]={id:r.id,x:portion(r,plan.target*SLOTS.find(s=>s[0]===slot)[1])};
  store.set('plan',plan); render();
}

const BK_KEYS = ['profile','plan','favs','shop','mine','log','prog','timers','recent','badges','cooked'];
const isObj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
const BK_SHAPE={
  profile:v=>isObj(v)&&['peso','alt','eta'].every(k=>typeof v[k]==='number'&&v[k]>0),
  plan:v=>v===null||(isObj(v)&&Array.isArray(v.days)&&v.days.every(isObj)),
  favs:Array.isArray, shop:Array.isArray, timers:Array.isArray, recent:Array.isArray, prog:v=>Array.isArray(v)&&v.every(isObj),
  mine:v=>Array.isArray(v)&&v.every(r=>isObj(r)&&r.id&&Array.isArray(r.ing)&&Array.isArray(r.s)&&Array.isArray(r.m)&&Array.isArray(r.tags)),
  log:v=>isObj(v)&&Object.values(v).every(d=>isObj(d)&&Array.isArray(d.items)),
  badges:isObj, cooked:v=>typeof v==='number'&&v>=0
};
function exportData(){
  const data={}; BK_KEYS.forEach(k=>{ const v=store.get(k,undefined); if(v!==undefined) data[k]=v; });
  return JSON.stringify({app:'foodie',v:1,at:new Date().toISOString(),data});
}
function importData(text){
  let o; try{ o=JSON.parse(text); }catch(e){ return {ok:false,msg:'Questo non è un backup di Foodie: il testo non è leggibile.'}; }
  if(!o||o.app!=='foodie') return {ok:false,msg:'Questo non è un backup di Foodie.'};
  if(!o.data||typeof o.data!=='object'||Array.isArray(o.data)) return {ok:false,msg:'Il backup è vuoto o rovinato: nessun dato modificato.'};
  const keys=Object.keys(o.data).filter(k=>BK_KEYS.includes(k)); if(!keys.length) return {ok:false,msg:'Il backup non contiene dati di Foodie.'};
  const bad=keys.filter(k=>!BK_SHAPE[k](o.data[k])); if(bad.length) return {ok:false,msg:'Il backup è rovinato: nessun dato modificato.'};
  keys.forEach(k=>store.set(k,o.data[k]));
  return {ok:true,msg:`Ripristinati ${keys.length} gruppi di dati.`};
}

function analyzeFood(text){

function glyphOf(r){

  if(r.tags.includes('sgarro')&&!r.tags.includes('carne')&&!/pizza|pasta|mac/.test(n)) return 'dolce';

/* ---------- Timer che restano attivi (anche chiudendo la ricetta o l'app) ---------- */
let AC=null, tIv=null, tSig='';
let timers = store.get('timers',[]).filter(t=>t.end>Date.now()-15*60000);
function audio(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){} return AC; }
function beep(){ const a=audio(); if(!a) return; try{ [0,.45,.9,1.35].forEach(t=>{ const o=a.createOscillator(), g=a.createGain(); o.frequency.value=t%0.9?660:880; o.connect(g); g.connect(a.destination); g.gain.setValueAtTime(.32,a.currentTime+t); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.35); o.start(a.currentTime+t); o.stop(a.currentTime+t+.37); }); }catch(e){} }
function saveTimers(){ store.set('timers',timers); }
function addTimer(label,sec){ audio(); timers.push({id:String(Date.now()),label,end:Date.now()+sec*1000,done:false}); saveTimers(); runTimers(); }
function runTimers(){ clearInterval(tIv); tIv = timers.length ? setInterval(drawTimers,500) : null; drawTimers(); }
function drawTimers(){
  const dock=$('timer-dock'); if(!dock) return; const now=Date.now(); let fired=false;
  timers.forEach(t=>{ if(!t.done&&t.end<=now){ t.done=true; fired=true; } });
  if(fired){ saveTimers(); beep(); try{ navigator.vibrate&&navigator.vibrate([300,150,300,150,300]); }catch(e){} }
  const sig=timers.map(t=>t.id+(t.done?'d':'')).join(',');
  if(sig!==tSig){ tSig=sig;
    dock.innerHTML=timers.map(t=>`<div class="tpill ${t.done?'done':''}" data-tid="${t.id}">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>
      <div class="tp-t"><span class="tp-l">${esc(t.label)}</span><b class="num" data-left></b></div>
      ${t.done?'':`<button class="tp-b" data-act="tplus" data-t="${t.id}" aria-label="Aggiungi un minuto">+1′</button>`}
      <button class="tp-b" data-act="tstop" data-t="${t.id}" aria-label="${t.done?'Chiudi':'Ferma il timer'}">${t.done?'OK':'×'}</button></div>`).join('');
  }
  dock.querySelectorAll('.tpill').forEach(el=>{ const t=timers.find(x=>x.id===el.dataset.tid); if(t) el.querySelector('[data-left]').textContent = t.done?'Tempo scaduto!':mmss(Math.max(0,Math.ceil((t.end-now)/1000))); });
  if(!timers.length && tIv){ clearInterval(tIv); tIv=null; }
}

/* ---------- Modalità cucina ---------- */
function cook(id,px){
  const r=byId[id], st={i:-1,wl:null,chk:new Set(),started:new Set()};
  const root=$('overlay-root'); document.body.classList.add('cooking'); audio();
  try{ navigator.wakeLock && navigator.wakeLock.request('screen').then(w=>st.wl=w).catch(()=>{}); }catch(e){}
  const close=()=>{ try{ st.wl&&st.wl.release(); }catch(e){} root.innerHTML=''; document.body.classList.remove('cooking'); document.removeEventListener('keydown',onKey); };
  const go=d=>{ st.i=Math.max(-1,Math.min(r.s.length,st.i+d)); draw(); };
  const onKey=e=>{ if(e.key==='Escape') close(); else if(e.key==='ArrowRight') go(1); else if(e.key==='ArrowLeft') go(-1); };
  document.addEventListener('keydown',onKey);
  const short=r.n.split(/[,(]/)[0].trim();
  const ingRow=i=>`<li><span>${esc(i[0])}</span><b class="num">${qty(i[1]*px,i[2])}</b></li>`;
  const clock='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9.5 2.5h5"/></svg>';
  function draw(){
    const n=r.s.length; let body;
    if(st.i<0) body=`<div class="eyebrow">Prima di iniziare: prendi tutto${px!==1?` · ${fmt(px)} porzioni`:''}</div><ul class="ck-ing">${r.ing.map((g,j)=>`<li><label><input type="checkbox" id="ck-${j}" data-j="${j}" ${st.chk.has(j)?'checked':''}><span>${esc(g[0])}</span><b class="num">${qty(g[1]*px,g[2])}</b></label></li>`).join('')}</ul>`;
    else if(st.i>=n){ if(!st.counted){ st.counted=true; store.set('cooked',store.get('cooked',0)+1); celebrate(); } body=`<div class="eyebrow">Fatto</div><p class="ck-step">Buon appetito!</p>${r.h?`<div class="hint"><b>Ricorda:</b> ${esc(r.h)}</div>`:''}`; }
    else { const s=r.s[st.i], sec=stepSecs(s), used=stepIngs(r,s);
      body=`<div class="eyebrow">Passo ${st.i+1} di ${n}</div><p class="ck-step">${esc(s)}</p>
        ${used.length?`<div class="ck-use"><div class="eyebrow">Ti serve in questo passaggio</div><ul>${used.map(ingRow).join('')}</ul></div>`:''}
        ${sec?(st.started.has(st.i)?`<p class="ck-ok">${clock} Timer avviato: lo trovi in basso e resta attivo anche se chiudi la ricetta.</p>`:`<button class="btn primary big" id="ck-start">${clock} Avvia timer ${sec>=60?Math.round(sec/60)+' min':sec+' s'}</button>`):''}
        <details class="ck-all"><summary>Tutti gli ingredienti con le dosi</summary><ul>${r.ing.map(ingRow).join('')}</ul></details>`; }
    root.innerHTML=`<div class="cook" role="dialog" aria-modal="true" aria-label="Modalità cucina: ${esc(r.n)}">
      <div class="ck-top">${thumb(r,r.m[0],'sm')}<b class="ck-title">${esc(r.n)}</b><button class="icon-btn" id="ck-x" aria-label="Esci dalla modalità cucina"><svg width="16" height="16" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
      <div class="ck-dots">${Array.from({length:n+2},(_,k)=>`<i class="${k-1<=st.i?'on':''}"></i>`).join('')}</div>
      <div class="ck-body">${body}</div>
      <div class="ck-nav"><button class="btn big" id="ck-prev" ${st.i<0?'disabled':''}>Indietro</button>${st.i>=n?`<button class="btn primary big" id="ck-end">Chiudi</button>`:`<button class="btn primary big" id="ck-next">${st.i<0?'Inizia':'Avanti'}</button>`}</div>
    </div>`;
    $('ck-x').onclick=close; $('ck-prev').onclick=()=>go(-1);
    if($('ck-next')) $('ck-next').onclick=()=>go(1); if($('ck-end')) $('ck-end').onclick=close;
    if($('ck-start')) $('ck-start').onclick=()=>{ addTimer(`${short} · passo ${st.i+1}`, stepSecs(r.s[st.i])); st.started.add(st.i); draw(); };
    root.querySelectorAll('.ck-ing input').forEach(c=>c.onchange=()=>{ c.checked?st.chk.add(+c.dataset.j):st.chk.delete(+c.dataset.j); });
  }
  draw();
}

  const name=m[3].trim(); return [name.charAt(0).toUpperCase()+name.slice(1), parseFloat(m[1].replace(',','.')), u];
}

  daytoday:()=>{ ui.dayOff=0; viewOggi(); },
  goday:t=>{ ui.dayOff=+t.dataset.off; viewOggi(); },
  'backup-dl':()=>{ try{ const b=new Blob([exportData()],{type:'application/json'}), a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=`foodie-backup-${todayKey()}.json`; document.body.appendChild(a); a.click(); a.remove(); $('bk-msg').innerHTML='<p class="note" style="margin:0">Se il file non si è scaricato, usa "Copia backup" e incollalo in una nota.</p>'; }catch(e){ HANDLERS['backup-copy'](); } },
  'backup-copy':()=>{ const s=exportData(), ta=$('bk-in'); const done=()=>{ $('bk-msg').innerHTML='<p class="ck-ok">Backup copiato: incollalo in una nota o in un messaggio a te stesso.</p>'; };
    try{ navigator.clipboard.writeText(s).then(done).catch(()=>{ ta.value=s; ta.select(); $('bk-msg').innerHTML='<p class="note" style="margin:0">Ho messo il backup nel riquadro e l\'ho selezionato: copialo tu.</p>'; }); }catch(e){ ta.value=s; ta.select(); } },
  'backup-restore':()=>{ const t=$('bk-in').value.trim(); if(!t){ $('bk-msg').innerHTML='<p class="note" style="margin:0">Incolla prima il backup nel riquadro.</p>'; return; }
    $('bk-msg').innerHTML='<div class="note warn" style="display:grid;gap:8px"><b>I dati attuali verranno sostituiti da quelli del backup.</b><div class="row"><button class="btn primary" data-act="backup-confirm">Sì, ripristina</button><button class="btn" data-act="backup-cancel">Annulla</button></div></div>'; },
  'backup-cancel':()=>{ $('bk-msg').innerHTML=''; },
  'backup-confirm':()=>{ const r=importData($('bk-in').value.trim()); $('bk-msg').innerHTML=`<p class="${r.ok?'ck-ok':'note'}" style="margin:0">${esc(r.msg)}${r.ok?' Ricarico l\'app…':''}</p>`; if(r.ok) setTimeout(()=>location.reload(),900); },
  train:t=>{ const k=t.dataset.k, cur=log[k]&&log[k].train; setTrain(k, cur===t.dataset.v?null:t.dataset.v); render(); },
  rmprog:t=>{ prog=prog.filter(x=>String(x.t)!==t.dataset.d); store.set('prog',prog); viewOggi(); }
};
document.addEventListener('click',e=>{
  const t = e.target.closest('button'); if(!t) return;
  if(t.dataset.act && HANDLERS[t.dataset.act]){ HANDLERS[t.dataset.act](t); celebrate(); return; }
  if(t.dataset.open){openRecipe(t.dataset.open,parseFloat(t.dataset.x)||1);return}
  if(t.dataset.swap){const [d,sl]=t.dataset.swap.split('|');swap(+d,sl);return}
  if(t.id==='regen'){makePlan();render();return}
  if(t.id==='toggle-shop'){ui.showShop=!ui.showShop;render();return}
  if(t.dataset.slot){ui.slot=t.dataset.slot;viewRicette();return}
  if(t.dataset.flt){const f=t.dataset.flt;ui.flt.has(f)?ui.flt.delete(f):ui.flt.add(f);viewRicette();return}
  if(t.dataset.cat){ui.cat=t.dataset.cat;viewConsigli();return}
  if(t.dataset.wk){ui.wk=t.dataset.wk;viewAllenamento();return}
});
document.addEventListener('input',e=>{
  if(e.target.id==='search'){ ui.q=e.target.value; $('cards').innerHTML=cardsHTML(); }
  if(e.target.id==='q-txt'){ ui.qtxt=e.target.value; $('q-res').innerHTML=foodResHTML(); }
  if(e.target.id==='pantry'){ ui.pantry=e.target.value; $('cards').innerHTML=cardsHTML(); }
});
document.addEventListener('change',e=>{
  if(e.target.id==='bk-file'&&e.target.files&&e.target.files[0]){ const fr=new FileReader(); fr.onload=()=>{ $('bk-in').value=fr.result; HANDLERS['backup-restore'](); }; fr.readAsText(e.target.files[0]); return; }
  if(e.target.dataset.shop){const k=e.target.dataset.shop;e.target.checked?shopDone.add(k):shopDone.delete(k);store.set('shop',[...shopDone]);
    const items=shopList();const span=document.querySelector('.shop .row .muted');if(span)span.textContent=`${items.filter(([k])=>!shopDone.has(k)).length} da prendere su ${items.length}`;}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='mf'){ e.preventDefault(); saveMine(new FormData(e.target)); return; }
  if(e.target.id!=='pf') return; e.preventDefault();
  const f = new FormData(e.target);
  profile = {sesso:f.get('sesso'),eta:+f.get('eta'),peso:+f.get('peso'),alt:+f.get('alt'),att:f.get('att'),obj:f.get('obj'),dieta:f.get('dieta'),sf:f.get('sf')==='on'};
  store.set('profile',profile); makePlan(); location.hash='piano';
});

render();
runTimers();
</script>

<script>
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
</html>
